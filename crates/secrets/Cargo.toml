[package]
name = "deepseek-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Secret storage backends (OS keyring with file fallback) for DeepSeek workspace"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Propeller fork: kernel-keyring only (no dbus-secret-service) so the build
# doesn't require pkg-config/libdbus-1-dev. Per-session storage is fine for
# the OwlTrail flow (API key comes from owltrail.conf via env, not keyring).
keyring = { version = "3", features = ["linux-native"] }

[dev-dependencies]
tempfile = "3.16"
